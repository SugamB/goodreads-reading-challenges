name: Build Static Guide

on:
  push:
    branches: [ main ]
    paths:
      - 'data.json'
      - 'guide.html'
      - 'build-guide.js'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Static Guide
        run: node build-guide.js

      - name: Commit updated guide.html
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update static guide from data.json [skip ci]"
          branch: main
          file_pattern: 'guide.html'
