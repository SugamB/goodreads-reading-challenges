name: Build Static Guide

on:
  push:
    branches: [ main ]
    paths:
      - 'data.json'
      - 'guide.template.html'
      - 'build-guide.js'
      - 'index.html'
      - '.github/workflows/build.yml'

concurrency:
  group: build-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static guide from data.json
        run: node build-guide.js

      - name: Commit updated guide.html
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-rebuild static guide from data.json [skip ci]"
          branch: main
          file_pattern: 'guide.html'